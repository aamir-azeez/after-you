name: Export the iOS Xcode project
description: >
  Exports the prepared game copy (see setup-godot-ios) to an Xcode project with the iOS
  preset, checks that Godot really produced it, and removes the empty privacy strings
  Godot writes for features the game does not use. Sets IOS_EXPORT for later steps.

inputs:
  configuration:
    description: debug or release
    required: false
    default: debug
  output-dir:
    description: Folder for the Xcode project; it is recreated.
    required: true

runs:
  using: composite
  steps:
    - name: Export the Xcode project
      shell: bash
      env:
        CONFIGURATION: ${{ inputs.configuration }}
        OUT: ${{ inputs.output-dir }}
      run: |
        set -euo pipefail
        case "$CONFIGURATION" in
          debug|release) ;;
          *) echo "::error::configuration must be debug or release"; exit 1 ;;
        esac
        rm -rf "$OUT"
        mkdir -p "$OUT"
        echo "IOS_EXPORT=$OUT" >> "$GITHUB_ENV"
        log="$IOS_LOGS/export-$CONFIGURATION.log"
        set +e
        "$GODOT" --headless --path "$GAME_COPY" "--export-$CONFIGURATION" "iOS" "$OUT/$EXPORT_NAME.ipa" 2>&1 | tee "$log"
        status=${PIPESTATUS[0]}
        set -e
        # Godot can return zero after a failed export, so check what it produced.
        if grep -Eq 'SCRIPT ERROR|Parse Error|Compilation failed' "$log"; then
          echo "::error::Export reported script errors"
          exit 1
        fi
        if [ "$status" -ne 0 ] || [ ! -d "$OUT/$EXPORT_NAME.xcodeproj" ]; then
          echo "::error::Godot did not produce $EXPORT_NAME.xcodeproj (exit $status)"
          ls -la "$OUT"
          exit 1
        fi
        ls -la "$OUT"

    - name: Restore the signed SDK frameworks
      shell: bash
      run: |
        set -euo pipefail
        sdk="$GAME_COPY/addons/after_you_ios/sdk"
        if [ ! -d "$sdk" ]; then
          exit 0
        fi
        # Godot copies vendored xcframeworks without the symlinks their signatures cover, and
        # App Store Connect requires privacy-impacting SDKs (Firebase, GoogleUtilities, nanopb)
        # to keep their original signatures. Replace each copy with the signed original.
        found=0
        while IFS= read -r copied; do
          name="$(basename "$copied")"
          original="$(find "$sdk" -name "$name" -type d -prune | head -1)"
          if [ -z "$original" ]; then
            echo "::error::No staged original for $name"
            exit 1
          fi
          rm -rf "$copied"
          ditto "$original" "$copied"
          if ! codesign --verify --verbose "$copied" 2>&1 | tee -a "$IOS_LOGS/sdk-signatures.txt"; then
            echo "::error::The signature of $name does not verify"
            exit 1
          fi
          codesign -dv "$copied" 2>&1 | grep -E '^(Authority|TeamIdentifier)=' | tee -a "$IOS_LOGS/sdk-signatures.txt" || true
          found=$((found + 1))
        done < <(find "$IOS_EXPORT" -path '*/dylibs/addons/after_you_ios/sdk/*' -name '*.xcframework' -type d -prune)
        echo "Restored and verified $found signed SDK frameworks"

    - name: Remove empty privacy strings
      shell: bash
      run: |
        set -euo pipefail
        plist="$IOS_EXPORT/$EXPORT_NAME/$EXPORT_NAME-Info.plist"
        test -f "$plist"
        # Godot writes these keys with empty values even when camera, microphone and photo
        # library are unused. Xcode warns, and App Store Connect rejects empty purpose strings.
        # A feature that needs one later gets real wording in the preset instead.
        for key in NSCameraUsageDescription NSMicrophoneUsageDescription NSPhotoLibraryUsageDescription; do
          if value="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null)" && [ -z "$value" ]; then
            /usr/libexec/PlistBuddy -c "Delete :$key" "$plist"
            echo "Removed empty $key"
          fi
        done
        plutil -lint "$plist"
        cp "$plist" "$IOS_LOGS/"
        # Godot writes the privacy manifest from the preset's privacy/* options.
        manifest="$(find "$IOS_EXPORT" -maxdepth 2 -name PrivacyInfo.xcprivacy -not -path '*/dylibs/*' | head -1)"
        if [ -z "$manifest" ]; then
          echo "::error::The export has no PrivacyInfo.xcprivacy"
          exit 1
        fi
        plutil -lint "$manifest"
        plutil -p "$manifest"
        cp "$manifest" "$IOS_LOGS/"
        # The manifest must match the App Privacy label: purchase history only in a store build
        # (setup-godot-ios sets IOS_PURCHASE_HISTORY). Only the app's own manifest is read;
        # RevenueCat's framework carries its own.
        python3 - "$manifest" <<'PY'
        import os, plistlib, sys

        def fail(message):
            print("::error::" + message)
            sys.exit(1)

        flag = os.environ.get("IOS_PURCHASE_HISTORY", "")
        if flag not in ("true", "false"):
            fail("IOS_PURCHASE_HISTORY is not set; run setup-godot-ios first")
        with open(sys.argv[1], "rb") as handle:
            manifest = plistlib.load(handle)
        if manifest.get("NSPrivacyTracking") is not False:
            fail("PrivacyInfo.xcprivacy must declare NSPrivacyTracking false")
        entries = manifest.get("NSPrivacyCollectedDataTypes", [])
        declared = sorted(entry.get("NSPrivacyCollectedDataType", "") for entry in entries)
        expected = ["NSPrivacyCollectedDataType" + name for name in ("UserID", "DeviceID", "PhotosorVideos", "GameplayContent", "OtherUserContent")]
        if flag == "true":
            expected.append("NSPrivacyCollectedDataTypePurchaseHistory")
        if declared != sorted(expected):
            fail(f"PrivacyInfo.xcprivacy declares {declared}, expected {sorted(expected)}")
        # Every type is linked to the player, never used for tracking, and only for app functionality.
        for entry in entries:
            if (entry.get("NSPrivacyCollectedDataTypeLinked") is not True
                    or entry.get("NSPrivacyCollectedDataTypeTracking") is not False
                    or entry.get("NSPrivacyCollectedDataTypePurposes") != ["NSPrivacyCollectedDataTypePurposeAppFunctionality"]):
                fail(f"PrivacyInfo.xcprivacy changed the details of {entry.get('NSPrivacyCollectedDataType')}")
        print("Privacy manifest data types match the store mode:", ", ".join(declared))
        PY
        plutil -p "$plist"
        grep -E 'PRODUCT_BUNDLE_IDENTIFIER|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY|CODE_SIGN_STYLE' \
          "$IOS_EXPORT/$EXPORT_NAME.xcodeproj/project.pbxproj" | sort -u || true
        # Sensor landscape (project.godot): both landscape sides on iPhone and on iPad, never
        # portrait. iPad runs full screen, with no multitasking resize.
        for key in UISupportedInterfaceOrientations 'UISupportedInterfaceOrientations~ipad'; do
          sides="$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null)" || { echo "::error::$key is absent"; exit 1; }
          for side in UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight; do
            if ! grep -q "$side" <<<"$sides"; then
              echo "::error::$key lacks $side"
              exit 1
            fi
          done
          if grep -q Portrait <<<"$sides"; then
            echo "::error::$key allows portrait"
            exit 1
          fi
        done
        if [ "$(/usr/libexec/PlistBuddy -c 'Print :UIRequiresFullScreen' "$plist" 2>/dev/null)" != true ]; then
          echo "::error::UIRequiresFullScreen must stay true"
          exit 1
        fi
        # targeted_device_family=2 in the preset: iPhone (1) and iPad (2) in every build setting.
        families="$(grep -E 'TARGETED_DEVICE_FAMILY' "$IOS_EXPORT/$EXPORT_NAME.xcodeproj/project.pbxproj" || true)"
        if [ -z "$families" ] || grep -vqE 'TARGETED_DEVICE_FAMILY = "?1,2"?;' <<<"$families"; then
          echo "::error::The Xcode project must target iPhone and iPad (1,2): $families"
          exit 1
        fi
        find "$IOS_EXPORT" -maxdepth 2 -path '*.xcframework/Info.plist' -print -exec plutil -p {} \;
        xcodebuild -list -project "$IOS_EXPORT/$EXPORT_NAME.xcodeproj"
