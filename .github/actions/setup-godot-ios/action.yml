name: Set up Godot for iOS export
description: >
  Installs the pinned Godot 4.7.2 macOS editor and its iOS export template (both
  checksum-verified and cached), prepares an isolated copy of the game for the iOS
  preset, and imports it. Sets GODOT, GAME_COPY, BUNDLE_ID, IOS_LOGS and
  IOS_PURCHASE_HISTORY for later steps.

inputs:
  team-id:
    description: >
      Apple team ID written into the isolated copy only. Godot refuses to export an iOS
      project without one, even unsigned, so simulator builds use a dummy value.
    required: false
    default: "0000000000"
  live-services:
    description: >
      "false" blanks the service URL, so a simulator run never reaches the live Worker. Only
      a signed TestFlight build sets "true".
    required: false
    default: "false"
  app-config-base64:
    description: >
      Base64 of a private app_config.json for iOS (repository secret IOS_APP_CONFIG_BASE64),
      holding the store mode and RevenueCat public key. Empty keeps purchases tester-only.
    required: false
    default: ""
  store-config:
    description: >
      JSON object merged into the store fields of app_config.json. CI uses it with placeholder
      values to prove that RevenueCat links; it never holds a real key.
    required: false
    default: ""
  universal-links:
    description: >
      "true" adds the Associated Domains entitlement for aamirazeez.com. Needs the Team ID,
      the App ID capability and the apple-app-site-association file online (owner steps).
    required: false
    default: "false"
  game-center:
    description: >
      "true" turns on the preset's Game Center entitlement in the copy. Signed builds only.
    required: false
    default: "false"
  icloud-container:
    description: >
      iCloud container (iCloud.<bundle id>) for the iCloud Documents entitlement. Empty leaves
      iCloud out. Signed builds only; the App ID must have the container assigned.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Restore the pinned engine and iOS template
      id: cache
      # Official actions/cache v6.1.0 (restore and save halves), pinned to its commit.
      # Saving right after the download keeps the 1.3 GB fetch cached even if a later step fails.
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/godot-ios
        key: godot-ios-${{ env.GODOT_VERSION }}-${{ env.GODOT_MACOS_SHA256 }}-${{ env.GODOT_TEMPLATES_SHA256 }}

    - name: Download and verify the pinned engine and templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        verify() {
          local actual
          actual="$(shasum -a 256 "$1" | awk '{print $1}')"
          if [ "$actual" != "$2" ]; then
            echo "::error::Checksum mismatch for $(basename "$1"): got $actual"
            exit 1
          fi
        }
        base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
        engine="Godot_v${GODOT_VERSION}_macos.universal.zip"
        templates="Godot_v${GODOT_VERSION}_export_templates.tpz"
        dest="$RUNNER_TEMP/godot-ios"
        download="$RUNNER_TEMP/godot-download"
        mkdir -p "$dest/templates" "$download"
        curl --fail --location --retry 2 --connect-timeout 15 --max-time 600 \
          "$base/$engine" --output "$download/$engine"
        verify "$download/$engine" "$GODOT_MACOS_SHA256"
        # The templates archive is about 1.3 GB; only the iOS template is kept and cached.
        curl --fail --location --retry 2 --connect-timeout 15 --max-time 1500 \
          "$base/$templates" --output "$download/$templates"
        verify "$download/$templates" "$GODOT_TEMPLATES_SHA256"
        ditto -x -k "$download/$engine" "$dest"
        unzip -q -j "$download/$templates" templates/ios.zip templates/version.txt -d "$dest/templates"
        rm -rf "$download"

    - name: Save the verified engine and iOS template
      if: steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/godot-ios
        key: ${{ steps.cache.outputs.cache-primary-key }}

    - name: Install the iOS export template
      shell: bash
      run: |
        set -euo pipefail
        cached="$RUNNER_TEMP/godot-ios"
        test -x "$cached/Godot.app/Contents/MacOS/Godot"
        installed="$HOME/Library/Application Support/Godot/export_templates/$GODOT_TEMPLATE_DIR_NAME"
        mkdir -p "$installed"
        cp "$cached/templates/ios.zip" "$cached/templates/version.txt" "$installed/"
        if [ "$(tr -d '[:space:]' < "$installed/version.txt")" != "$GODOT_TEMPLATE_DIR_NAME" ]; then
          echo "::error::Export template version does not match $GODOT_TEMPLATE_DIR_NAME"
          exit 1
        fi
        # The device (arm64) libraries are required. Godot 4.7.2's "arm64_x86_64-simulator"
        # slice holds only x86_64 objects, so the Simulator job builds x86_64 under Rosetta.
        listing="$(unzip -Z1 "$installed/ios.zip")"
        for variant in debug release; do
          if ! grep -Eq "libgodot\.ios\.$variant\.xcframework/ios-arm64/" <<<"$listing"; then
            echo "::error::The iOS template has no device (ios-arm64) $variant library"
            grep -E 'xcframework/[^/]+/$' <<<"$listing" || true
            exit 1
          fi
        done
        grep -E 'libgodot\.ios\.(debug|release)\.xcframework/[^/]+/$' <<<"$listing" || true
        mkdir -p "$RUNNER_TEMP/ios-logs"
        {
          echo "GODOT=$cached/Godot.app/Contents/MacOS/Godot"
          echo "IOS_LOGS=$RUNNER_TEMP/ios-logs"
          echo "GAME_COPY=$RUNNER_TEMP/after-you-game"
        } >> "$GITHUB_ENV"

    - name: Prepare an isolated game copy for the iOS preset
      shell: bash
      env:
        TEAM_ID: ${{ inputs.team-id }}
        LIVE_SERVICES: ${{ inputs.live-services }}
        APP_CONFIG_BASE64: ${{ inputs.app-config-base64 }}
        STORE_CONFIG: ${{ inputs.store-config }}
        UNIVERSAL_LINKS: ${{ inputs.universal-links }}
        GAME_CENTER: ${{ inputs.game-center }}
        ICLOUD_CONTAINER: ${{ inputs.icloud-container }}
      run: |
        set -euo pipefail
        rm -rf "$GAME_COPY"
        cp -a game "$GAME_COPY"
        # The iOS plugin addon, when build-ios-plugin staged one. It never lives in game/.
        if [ -n "${IOS_ADDON:-}" ] && [ -d "$IOS_ADDON" ]; then
          ditto "$IOS_ADDON" "$GAME_COPY/addons/after_you_ios"
        fi
        python3 - <<'PY'
        import base64, json, os, re
        from pathlib import Path

        root = Path(os.environ["GAME_COPY"])
        config_path = root / "app_config.json"
        config = json.loads(config_path.read_text(encoding="utf-8"))
        if os.environ["APP_CONFIG_BASE64"]:
            private = json.loads(base64.b64decode(os.environ["APP_CONFIG_BASE64"]).decode("utf-8"))
            if not isinstance(private, dict):
                raise SystemExit("IOS_APP_CONFIG_BASE64 must hold a JSON object")
            config.update(private)
        else:
            config["revenuecat_public_key"] = ""
            config["purchase_mode"] = "tester_only"
        if os.environ["STORE_CONFIG"]:
            extra = json.loads(os.environ["STORE_CONFIG"])
            for key in ("purchase_mode", "entitlement_id", "revenuecat_public_key"):
                if key in extra:
                    config[key] = extra[key]
        if os.environ["LIVE_SERVICES"] != "true":
            config["api_base_url"] = ""
        config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
        print("Store mode for this build:", config.get("purchase_mode"))
        # RevenueCat links only with a store mode and its key. The free build has neither, and
        # its App Privacy label says it collects no purchase history.
        store = config.get("purchase_mode") in ("app_store", "test_store") and bool(config.get("revenuecat_public_key"))

        presets_path = root / "export_presets.cfg"
        text = presets_path.read_text(encoding="utf-8").replace("\r\n", "\n")
        found = re.search(r'^\[preset\.(\d+)\]\nname="iOS"\nplatform="iOS"\n', text, re.M)
        if not found:
            raise SystemExit("export_presets.cfg has no iOS preset")
        header = f"[preset.{found.group(1)}.options]\n"
        start = text.index(header) + len(header)
        following = text.find("\n[", start)
        end = len(text) if following < 0 else following + 1
        options = text[start:end]
        # The bundle ID lives only in the preset; every later step reads it from here.
        bundle = re.search(r'^application/bundle_identifier="([A-Za-z0-9.-]+)"$', options, re.M)
        if not bundle:
            raise SystemExit("iOS preset has no bundle identifier")
        team_id = os.environ["TEAM_ID"]
        if not re.fullmatch(r"[A-Z0-9]{10}", team_id):
            raise SystemExit("Team ID must be 10 upper-case letters or digits")
        empty_team = 'application/app_store_team_id=""\n'
        if options.count(empty_team) != 1:
            raise SystemExit("iOS preset must keep an empty team ID in Git")
        options = options.replace(empty_team, f'application/app_store_team_id="{team_id}"\n')
        addon = root / "addons" / "after_you_ios"
        if (addon / "config" / "GoogleService-Info.plist").is_file():
            push_off = 'entitlements/push_notifications="Disabled"\n'
            if options.count(push_off) != 1:
                raise SystemExit("iOS preset must keep push notifications disabled in Git")
            options = options.replace(push_off, 'entitlements/push_notifications="Production"\n')
        if os.environ["GAME_CENTER"] == "true":
            center_off = 'entitlements/game_center=false\n'
            if options.count(center_off) != 1:
                raise SystemExit("iOS preset must keep Game Center off in Git")
            options = options.replace(center_off, 'entitlements/game_center=true\n')
        # The privacy manifest declares purchase history only for a store build.
        if store:
            purchases_off = 'privacy/collected_data/purchase_history/collected=false\n'
            if options.count(purchases_off) != 1:
                raise SystemExit("iOS preset must keep purchase history undeclared in Git")
            options = options.replace(purchases_off, 'privacy/collected_data/purchase_history/collected=true\n')
        print("Privacy manifest declares purchase history:", store)
        additional = []
        if os.environ["UNIVERSAL_LINKS"] == "true":
            additional.append("<key>com.apple.developer.associated-domains</key><array><string>applinks:aamirazeez.com</string></array>")
        container = os.environ["ICLOUD_CONTAINER"]
        if container:
            if container != f"iCloud.{bundle.group(1)}":
                raise SystemExit("iCloud container must be iCloud.<bundle identifier>")
            additional.append(
                f"<key>com.apple.developer.icloud-container-identifiers</key><array><string>{container}</string></array>"
                "<key>com.apple.developer.icloud-services</key><array><string>CloudDocuments</string></array>"
                f"<key>com.apple.developer.ubiquity-container-identifiers</key><array><string>{container}</string></array>")
        if additional:
            entitlements_off = 'entitlements/additional=""\n'
            if options.count(entitlements_off) != 1:
                raise SystemExit("iOS preset must keep additional entitlements empty in Git")
            options = options.replace(entitlements_off, 'entitlements/additional="' + "".join(additional) + '"\n')
        text = text[:start] + options + text[end:]
        if addon.is_dir():
            if not store:
                # The export plugin leaves RevenueCat out, so its notice goes too.
                (addon / "licenses" / "RevenueCat-iOS-MIT.txt").unlink(missing_ok=True)
            # SDKs and the Firebase plist go into the Xcode project, never into the game pack.
            # The plugin's licence notices go into the pack for the Licenses screen.
            section_start = found.start()
            section_end = text.index(header, section_start)
            section = text[section_start:section_end]
            for key, added in (("exclude_filter", ["addons/after_you_ios/sdk/*", "addons/after_you_ios/config/*"]), ("include_filter", ["addons/after_you_ios/licenses/*.txt"])):
                current = re.search(r'^' + key + r'="([^"]*)"$', section, re.M)
                if not current:
                    raise SystemExit(f"iOS preset has no {key}")
                filters = [f for f in current.group(1).split(",") if f] + added
                section = section[:current.start()] + key + '="' + ",".join(filters) + '"' + section[current.end():]
            text = text[:section_start] + section + text[section_end:]
            project_path = root / "project.godot"
            project = project_path.read_text(encoding="utf-8")
            enabled = re.search(r'^enabled=PackedStringArray\((.*)\)$', project, re.M)
            if not enabled:
                raise SystemExit("project.godot has no enabled editor plugins")
            plugins = enabled.group(1) + ', "res://addons/after_you_ios/plugin.cfg"'
            project = project[:enabled.start()] + "enabled=PackedStringArray(" + plugins + ")" + project[enabled.end():]
            project_path.write_text(project, encoding="utf-8")
            print("iOS plugin addon installed")
        presets_path.write_text(text, encoding="utf-8")
        with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
            env.write(f"BUNDLE_ID={bundle.group(1)}\n")
            env.write(f"IOS_PURCHASE_HISTORY={'true' if store else 'false'}\n")
        print(f"Bundle ID from the iOS preset: {bundle.group(1)}")
        PY

    - name: Import the project
      shell: bash
      run: |
        set -euo pipefail
        "$GODOT" --version
        "$GODOT" --headless --path "$GAME_COPY" --editor --import --quit 2>&1 | tee "$IOS_LOGS/import.log"
        if grep -Eq 'SCRIPT ERROR|Parse Error|Compilation failed' "$IOS_LOGS/import.log"; then
          echo "::error::Import reported script errors"
          exit 1
        fi
