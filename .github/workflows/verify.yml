name: Verify game and backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: Android artifact paths
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preserve previously distributed builds
        shell: pwsh
        run: ./scripts/test-android-artifacts.ps1
      - name: Validate optional Firebase build configuration
        shell: pwsh
        run: ./scripts/test-android-firebase.ps1
      - name: Validate Play release preflight
        shell: pwsh
        run: ./scripts/test-android-play.ps1
      - name: Validate Android release optimization setup
        shell: pwsh
        run: ./scripts/test-android-optimization.ps1
      - name: Validate Android release artifact receipts
        shell: pwsh
        run: ./scripts/test-android-build-receipt.ps1
      - name: Check native page-alignment verifier
        shell: pwsh
        run: python ./scripts/test-android-pages.py
      - name: Verify native dependency notices
        shell: pwsh
        run: python ./scripts/test-native-notices.py
      - name: Print release notes from the bundled changelog
        shell: pwsh
        run: ./scripts/test-release-notes.ps1

  backend:
    name: Workers API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Official actions/checkout v6.1.0 and actions/setup-node v6.5.0, pinned to commits.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Diagnostic transport and cleanup
        run: node --test scripts/live-smoke.test.mjs scripts/leaderboard-job-token.test.mjs
      - name: Generate binding types
        run: npm run types
      - name: Type-check, test in Workers runtime, and validate bundle
        run: npm run check

  game:
    name: Godot native logic (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: "4.7.2-stable"
      # Official release asset digest, also checked against Godot's SHA512-SUMS.txt locally.
      GODOT_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download and verify the pinned native engine
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          printf 'GODOT=%s\n' "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prepare an isolated game copy with no live service configuration
        run: |
          set -euo pipefail
          cp -a game "$RUNNER_TEMP/after-you-game"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config_path = Path(os.environ["RUNNER_TEMP"]) / "after-you-game" / "app_config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["api_base_url"] = ""
          config["revenuecat_public_key"] = ""
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
      # Official actions/cache v6.1.0, pinned to its commit. The import below always runs, so a cache from an
      # older commit only saves work: Godot reimports any asset whose source changed and rescans every script.
      - name: Restore the import cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ${{ runner.temp }}/after-you-game/.godot
          key: godot-import-${{ env.GODOT_VERSION }}-${{ hashFiles('game/project.godot', 'game/**/*.import', 'game/**/*.png', 'game/**/*.svg', 'game/**/*.wav', 'game/**/*.ttf', 'game/**/*.gdshader*') }}
          restore-keys: godot-import-${{ env.GODOT_VERSION }}-
      - name: Import the native project
        run: |
          set -euo pipefail
          "$GODOT" --version
          XDG_DATA_HOME="$RUNNER_TEMP/godot-import" timeout 180s "$GODOT" --headless \
            --path "$RUNNER_TEMP/after-you-game" --editor --import --quit
      - name: Verify generated footstep audio
        run: python3 scripts/test_footsteps.py
      - name: Verify generated cue audio
        run: python3 scripts/test_cues.py
      - name: Simulation, app-state, lifecycle, presentation and audio suites
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          echo "Runner: $(nproc) CPUs, $(free -g | awk '/^Mem:/ { print $2 }') GB"
          mkdir -p "$RUNNER_TEMP/suite-logs"
          run_item() {
            local name=$1 started=$SECONDS status=0 log="$RUNNER_TEMP/suite-logs/$1.log"
            if [ "$name" = "@new_chapter_scaffold" ]; then
              # Scaffolds chapters in a temporary copy of the imported game, then runs their suites there.
              python3 scripts/test_new_chapter.py --godot "$GODOT" --game "$RUNNER_TEMP/after-you-game" > "$log" 2>&1 || status=$?
            else
              XDG_DATA_HOME="$RUNNER_TEMP/godot-state-$name" timeout 120s "$GODOT" --headless \
                --path "$RUNNER_TEMP/after-you-game" --script "res://tests/test_$name.gd" > "$log" 2>&1 || status=$?
              # Godot can return zero after a dependent script failed to compile.
              # A worker destroyed while it runs can crash the exit; see worker_reaper.gd.
              if grep -Eq 'SCRIPT ERROR|Parse Error|Compilation failed|being destroyed without its completion' "$log"; then status=1; fi
            fi
            {
              flock 9
              echo "::group::$name"; cat "$log"; echo "::endgroup::"
              # Wall time against the 120 s limit, so slow suites show before they fail.
              echo "SUITE TIME $name $((SECONDS - started)) s"
              if [ "$status" != 0 ]; then echo "::error::$name failed (exit $status)"; fi
            } 9>"$RUNNER_TEMP/suite-logs.lock"
            return "$status"
          }
          export -f run_item
          # scripts/ci_shards.py picks this shard's suites from game/tests/ci_shards.txt, longest first by
          # game/tests/ci_suite_times.txt; test_ci_shards.gd checks the list names every suite once.
          python3 scripts/ci_shards.py plan "$SHARD" > "$RUNNER_TEMP/shard-suites.txt"
          echo "Shard $SHARD: $(wc -l < "$RUNNER_TEMP/shard-suites.txt") items on $(nproc) lanes"
          # Each suite has its own user data folder, so several share the imported copy at once.
          # xargs runs every item and exits non-zero if any failed.
          xargs -a "$RUNNER_TEMP/shard-suites.txt" -P "$(nproc)" -I{} bash -c 'run_item "$1"' _ {}
          if [ "$SHARD" = 1 ]; then
            XDG_DATA_HOME="$RUNNER_TEMP/godot-native-wrappers" timeout 120s "$GODOT" --headless \
              --path "$RUNNER_TEMP/after-you-game" --script "$GITHUB_WORKSPACE/native/tests/test_wrappers.gd"
          fi
