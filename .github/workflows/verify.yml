name: Verify game and backend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  artifacts:
    name: Android artifact paths
    runs-on: windows-2025
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Preserve previously distributed builds
        shell: pwsh
        run: ./scripts/test-android-artifacts.ps1
      - name: Validate optional Firebase build configuration
        shell: pwsh
        run: ./scripts/test-android-firebase.ps1
      - name: Validate Play release preflight
        shell: pwsh
        run: ./scripts/test-android-play.ps1
      - name: Validate Android release optimization setup
        shell: pwsh
        run: ./scripts/test-android-optimization.ps1
      - name: Validate Android release artifact receipts
        shell: pwsh
        run: ./scripts/test-android-build-receipt.ps1
      - name: Check native page-alignment verifier
        shell: pwsh
        run: python ./scripts/test-android-pages.py
      - name: Verify native dependency notices
        shell: pwsh
        run: python ./scripts/test-native-notices.py

  backend:
    name: Workers API
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
        shell: bash
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Official actions/checkout v6.1.0 and actions/setup-node v6.5.0, pinned to commits.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24.16.0"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install pinned dependencies
        run: npm ci --no-audit --no-fund
      - name: Diagnostic transport and cleanup
        run: node --test scripts/live-smoke.test.mjs
      - name: Generate binding types
        run: npm run types
      - name: Type-check, test in Workers runtime, and validate bundle
        run: npm run check

  game:
    name: Godot native logic (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: "4.7.2-stable"
      # Official release asset digest, also checked against Godot's SHA512-SUMS.txt locally.
      GODOT_SHA256: "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4"
      GODOT_SILENCE_ROOT_WARNING: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Download and verify the pinned native engine
        run: |
          set -euo pipefail
          archive="Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 180 \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/${archive}" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/godot"
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64"
          printf 'GODOT=%s\n' "$RUNNER_TEMP/godot/Godot_v${GODOT_VERSION}_linux.x86_64" >> "$GITHUB_ENV"
      - name: Prepare an isolated game copy with no live service configuration
        run: |
          set -euo pipefail
          cp -a game "$RUNNER_TEMP/after-you-game"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config_path = Path(os.environ["RUNNER_TEMP"]) / "after-you-game" / "app_config.json"
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["api_base_url"] = ""
          config["revenuecat_public_key"] = ""
          config_path.write_text(json.dumps(config, indent=2) + "\n", encoding="utf-8")
          PY
      - name: Import the native project
        run: |
          set -euo pipefail
          "$GODOT" --version
          XDG_DATA_HOME="$RUNNER_TEMP/godot-import" timeout 180s "$GODOT" --headless \
            --path "$RUNNER_TEMP/after-you-game" --editor --import --quit
      - name: Verify generated footstep audio
        run: python3 scripts/test_footsteps.py
      - name: Simulation, app-state, lifecycle, presentation and audio suites
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          run_suite() {
            local started=$SECONDS
            XDG_DATA_HOME="$RUNNER_TEMP/godot-state-$1" timeout 120s "$GODOT" --headless \
              --path "$RUNNER_TEMP/after-you-game" --script "res://tests/test_$1.gd" 2>&1 | tee "$RUNNER_TEMP/$1.log"
            # Wall time against the 120 s limit, so slow suites show before they fail.
            echo "SUITE TIME $1 $((SECONDS - started)) s"
            # Godot can return zero after a dependent script failed to compile.
            if grep -Eq 'SCRIPT ERROR|Parse Error|Compilation failed' "$RUNNER_TEMP/$1.log"; then exit 1; fi
          }
          # Three shards balanced by CI runtime. Put a new suite in the shard with the least time.
          if [ "$SHARD" = 1 ]; then for suite in subscription_access keepsake_leave lighthouse_v2_join lighthouse_v2_release proof_warmup production_without_story campaign_catalog story_comfort_session campaign_protocol campaign_child_transport campaign_photo_context campaign_presence_context campaign_lobby_protocol campaign_terminal_selection campaign_flow chapter_navigation cooperative physical_runtime wishing_well wishing_well_world journey_corrections long_way_home_versions long_way_home_v2_latest long_way_home_v2_world tide_world cooperative_integration cumulative_holds legacy_cumulative_holds first_steps first_steps_campaign first_steps_preview relay_preview beam_field borrowed_light missing_piece two_promises lighthouse_compatibility github_access review_access settings hud_efficiency friend_presence_ui spirit_motion recovery_copy recovery_details license_catalog chapter_footsteps action_availability optional_photo_capture home_keepsake_display home_scene_navigation deleted_identity_photo_cleanup photo_delivery_client photo_transfer_client shared_replays replay_transfer player_copy player_copy_render chapter_picker friends_client recent_rooms redo_session scrolling_camera intro_comfort comfort_journal ball_ownership object_motion_trail restart_chapter_ui comfort_social_integration solo_replay_collection solo_replay_launch room_inbox_client room_hub_activity room_removal registry_golden replay_golden_physical world_fingerprint_journey world_fingerprint_lighthouse dressing_lint turn_of_the_tide_presses turn_of_the_tide_limits turn_of_the_tide_bytes rules_thread_safety worker_quit lighthouse_v2_proof label_bubble_tails; do run_suite "$suite"; done; fi
          if [ "$SHARD" = 2 ]; then for suite in turn_save_checks journey_proofs solo_draft_writer lighthouse_v2_room lighthouse_v2_solo world_fingerprint_lighthouse_v2 lighthouse_hud campaign_control_transport seed_timer_bar campaign_replay_context campaign_auxiliary_consumers campaign_lobby_owner campaign_lobby_cancel campaign_store campaign_terminal_session campaign_terminal_admission campaign_session campaign_replay_authority campaign_story campaign_cold_dialogue campaign_memory_flow campaign_handoff chapter_access house_world journey_world long_way_home_v2 long_way_home_v2_limits simulation first_steps_lift_continuity chapter_registry seed_visual first_steps_ui relay_journey relay_room_coordinator first_bell carried_light welcome_light lighthouse_preview purchase_session tester_access_integration chapter_controls app_state lifecycle completion_moment garden_activation plant_animation touch_scrolling licenses soundscape refresh_schedule room_reactions reaction_photos photo_fast_skip photo_preferences photo_open_wait replay_photo_contributions home_stage safety_client safety_photos turn_notifications turn_photo_library photo_transfer_screen replay_transfer_session replay_transfer_delivery when_label shared_photo_fetch periodic_room_save camera_exploration hosting_notification_preferences friends_navigation friends_first_open share_codes invite_links recent_rooms_ui redo_navigation gameplay_comfort comfort_bounds comfort_restart late_ball friend_nicknames friend_room_events_client sound_map world_fingerprint_physical world_kit turn_of_the_tide turn_of_the_tide_ways turn_of_the_tide_variants_low; do run_suite "$suite"; done; fi
          if [ "$SHARD" = 3 ]; then for suite in replay_row_taps turn_check_worker staged_build lighthouse_v2_replays chapter_loading_card archived_story_navigation seed_spin campaign_headers campaign_ordinary_guard campaign_auxiliary_context campaign_safety_context campaign_terminal_owner campaign_recovery campaign_continuation campaign_room_bridge campaign_online_session campaign_owned_restore campaign_recovery_replay story_camera story_memory story_panel house journey_seven cooperative_admission simulation_v2 chapter_settings_compatibility first_steps_world relay_online lighthouse_verification_cache lighthouse_loader lighthouse_loading lighthouse_admission lighthouse_journey lighthouse_world lighthouse_finale paid_level_thumbnails purchase_store_boundary purchase_recovery purchase_session_startup store_loading_feedback tester_access objective_panel action_buttons chapter_exit lift_presentation scroll_lists layout room_layout safe_area graphics_policy graphics_settings render_efficiency friend_presence recovery_import audio_integration turn_photo first_steps_photo_world room_refresh_noop home_keepsakes home_keepsake_lifecycle deleted_identity_caches safety_screen turn_notification_bridge choice_buttons friends_screen redo_client legacy_redo_navigation comfort_rules rolling_offer chapter_thumbnail_catalog solo_replay_visibility solo_replay_scene_context replay_loading_feedback hosting_locked replay_golden replay_golden_journey world_fingerprint long_way_home_hosting turn_of_the_tide_history turn_of_the_tide_reach turn_of_the_tide_variants_half turn_of_the_tide_greedy turn_of_the_tide_variants_high rooms_api_limits solo_redo solo_redo_ui; do run_suite "$suite"; done; fi
          if [ "$SHARD" = 1 ]; then
            XDG_DATA_HOME="$RUNNER_TEMP/godot-native-wrappers" timeout 120s "$GODOT" --headless \
              --path "$RUNNER_TEMP/after-you-game" --script "$GITHUB_WORKSPACE/native/tests/test_wrappers.gd"
          fi
