name: iOS build

# Phase 1 proves the iOS export compiles and links for a real iOS device (arm64) without
# any Apple credentials. A manual run button only appears once this file is on main; until
# then, pushing a branch named ios/... runs it. Not on tags, so Android releases stay Linux-only.
on:
  workflow_dispatch:
  push:
    branches: ["ios/**"]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATE_DIR_NAME: "4.7.2.stable"
  # Official godot-builds release asset digests, also listed in Godot's SHA512-SUMS.txt.
  GODOT_MACOS_SHA256: "c58a24e31d720be9d62f60cb5627c4e695fb72f21b0cfe1bc9ccaa9a3b3ba63e"
  GODOT_TEMPLATES_SHA256: "f298490b8d44d934be425a5a65a51bf15f422428b229a06a6e11d9ffea248011"
  XCODE_APP: /Applications/Xcode_26.6.app
  # The iOS plugin (native/ios): godot-cpp, and the two SDKs it can use. Release digests come
  # from the GitHub release API (Firebase) or were computed from the release asset (RevenueCat).
  GODOT_CPP_TAG: "10.0.0-stable"
  GODOT_CPP_COMMIT: "507ed9d840c01a3c5b2a39af8bb4000bfac30bf5"
  REVENUECAT_IOS_VERSION: "5.95.0"
  REVENUECAT_IOS_SHA256: "3ed54977918d875582cd3ecd9c2642d0fe1b0f24b97422c2b11c9925e039b433"
  FIREBASE_IOS_VERSION: "13.0.1"
  FIREBASE_IOS_SHA256: "8ab2a495bdd811ae187baae31afc66c69f46fd341303712041988c89782234d9"
  SIMULATOR_DEVICE: iPhone 17 Pro
  EXPORT_NAME: AfterYou

jobs:
  device:
    name: iOS device build (unsigned, arm64, ${{ matrix.services }})
    # Standard arm64 runner: free on a public repository. Never use -large or -xlarge.
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # none: the default build, with no store key and no Firebase plist, as shipped from Git.
        # linked: placeholder settings that pull RevenueCat and Firebase into the link. The app
        # would treat them as invalid at run time; this only proves the SDKs build and link.
        services: [none, linked]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Build the iOS plugin
        uses: ./.github/actions/build-ios-plugin
        with:
          # The linked leg uses the real Firebase client plist once the owner adds the secret
          # (public client configuration, still kept out of Git and logs), else a placeholder.
          firebase-plist-base64: ${{ matrix.services == 'linked' && secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 || '' }}
          firebase-link-check: ${{ matrix.services == 'linked' && secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 == '' }}

      - name: Set up Godot for iOS export
        uses: ./.github/actions/setup-godot-ios
        with:
          store-config: ${{ matrix.services == 'linked' && '{"purchase_mode":"test_store","entitlement_id":"full_journey","revenuecat_public_key":"test_link_check_only"}' || '' }}

      - name: Export the Xcode project
        uses: ./.github/actions/export-ios
        with:
          configuration: debug
          output-dir: ${{ runner.temp }}/ios-export

      - name: Check that the export includes the plugin
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          set -euo pipefail
          # Godot registers a static GDExtension through generated C++ in the project.
          if ! grep -rl --include='*.cpp' --include='*.mm' 'after_you_ios_library_init' "$IOS_EXPORT" > /dev/null; then
            echo "::error::The exported project does not register the iOS plugin"
            exit 1
          fi
          find "$IOS_EXPORT" -maxdepth 3 -name '*.xcframework' -print | sort
          pbx="$IOS_EXPORT/$EXPORT_NAME.xcodeproj/project.pbxproj"
          grep -q 'libafteryou_ios.ios.template_debug.xcframework' "$pbx"
          if [ "$SERVICES" = linked ]; then
            grep -q 'RevenueCat.xcframework' "$pbx"
            grep -q 'FirebaseMessaging.xcframework' "$pbx"
            # RevenueCat plus the eight Firebase frameworks keep their vendor signatures.
            verified="$(grep -c 'valid on disk' "$IOS_LOGS/sdk-signatures.txt" || true)"
            if [ "$verified" -ne 9 ]; then
              echo "::error::Expected 9 signed SDK frameworks in the export, verified $verified"
              exit 1
            fi
            if [ -z "$(find "$IOS_EXPORT" -name 'GoogleService-Info.plist')" ]; then
              echo "::error::The Firebase plist was not added to the Xcode project"
              exit 1
            fi
          else
            if grep -q 'RevenueCat.xcframework\|FirebaseMessaging.xcframework' "$pbx"; then
              echo "::error::A build without store or push settings must not include their SDKs"
              exit 1
            fi
          fi

      - name: Compile and link for an iOS device, unsigned
        timeout-minutes: 30
        env:
          SERVICES: ${{ matrix.services }}
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/ios-derived"
          if ! xcodebuild \
            -project "$IOS_EXPORT/$EXPORT_NAME.xcodeproj" \
            -scheme "$EXPORT_NAME" \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$derived" \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > "$IOS_LOGS/xcodebuild-device.log" 2>&1; then
            grep -E 'error:|Undefined symbols|\*\* BUILD' "$IOS_LOGS/xcodebuild-device.log" | tail -80 || true
            tail -60 "$IOS_LOGS/xcodebuild-device.log"
            echo "::error::xcodebuild failed for a generic iOS device"
            exit 1
          fi
          tail -5 "$IOS_LOGS/xcodebuild-device.log"
          # Linker warnings other than known Godot auto-link noise, for the next reader.
          grep -E 'ld: warning' "$IOS_LOGS/xcodebuild-device.log" | sort -u | head -40 || true
          app="$derived/Build/Products/Debug-iphoneos/$EXPORT_NAME.app"
          test -d "$app"
          built_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          if [ "$built_id" != "$BUNDLE_ID" ]; then
            echo "::error::Built bundle ID $built_id does not match the preset's $BUNDLE_ID"
            exit 1
          fi
          for key in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion \
            MinimumOSVersion UIDeviceFamily UISupportedInterfaceOrientations UIRequiresFullScreen \
            ITSAppUsesNonExemptEncryption NSCameraUsageDescription NSMicrophoneUsageDescription \
            NSPhotoLibraryUsageDescription; do
            printf '%s: ' "$key"
            /usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" 2>/dev/null || echo "(absent)"
          done | tee "$IOS_LOGS/app-identity.txt"
          # The executable must be arm64 code for the iOS (device) platform.
          lipo -info "$app/$executable" | tee -a "$IOS_LOGS/app-identity.txt"
          xcrun vtool -show-build "$app/$executable" | tee -a "$IOS_LOGS/app-identity.txt"
          if ! lipo "$app/$executable" -verify_arch arm64; then
            echo "::error::The device executable has no arm64 code"
            exit 1
          fi
          du -sh "$app" | tee -a "$IOS_LOGS/app-identity.txt"
          # The plugin's entry point and singleton must be in the linked executable.
          nm "$app/$executable" > "$RUNNER_TEMP/app-symbols.txt"
          strings "$app/$executable" > "$RUNNER_TEMP/app-strings.txt"
          grep -q '_after_you_ios_library_init$' "$RUNNER_TEMP/app-symbols.txt"
          grep -q 'AfterYouIOS' "$RUNNER_TEMP/app-strings.txt"
          if [ "$SERVICES" = linked ]; then
            test -d "$app/Frameworks/RevenueCat.framework"
            grep -q 'OBJC_CLASS_\$_FIRMessaging' "$RUNNER_TEMP/app-symbols.txt"
            echo "RevenueCat embedded and Firebase Messaging linked" | tee -a "$IOS_LOGS/app-identity.txt"
          else
            if [ -d "$app/Frameworks/RevenueCat.framework" ]; then
              echo "::error::RevenueCat was embedded without a store configuration"
              exit 1
            fi
          fi
          ls "$app/Frameworks" 2>/dev/null | tee -a "$IOS_LOGS/app-identity.txt" || true

      - name: Package the Xcode project
        if: always() && env.IOS_EXPORT != ''
        run: |
          if [ -d "$IOS_EXPORT/$EXPORT_NAME.xcodeproj" ]; then
            ditto -c -k --keepParent "$IOS_EXPORT" "$RUNNER_TEMP/ios-xcode-project.zip"
          fi

      - name: Upload logs
        if: always()
        # Official actions/upload-artifact v7.0.1, pinned to its commit.
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-device-logs-${{ matrix.services }}
          path: ${{ runner.temp }}/ios-logs
          retention-days: 14
          if-no-files-found: warn

      - name: Upload the exported Xcode project
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-xcode-project-${{ matrix.services }}
          path: ${{ runner.temp }}/ios-xcode-project.zip
          retention-days: 7
          if-no-files-found: warn

  simulator:
    name: iOS Simulator launch (x86_64 under Rosetta, best effort)
    # Godot 4.7.2's simulator library holds only x86_64 code, so this builds x86_64 and relies
    # on Rosetta. It never fails the workflow; the device job above is the proof.
    needs: device
    continue-on-error: true
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          sudo xcode-select --switch "$XCODE_APP"
          xcodebuild -version

      - name: Find Rosetta and an x86_64 iOS runtime
        run: |
          set -euo pipefail
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            echo "Rosetta is available"
          else
            # Installing it would accept Apple's licence on the runner; that is the owner's call.
            echo "::notice::Rosetta is not installed on this runner; the Simulator launch is skipped"
            echo "SIM_SKIP=no-rosetta" >> "$GITHUB_ENV"
          fi
          xcrun simctl list runtimes --json > "$RUNNER_TEMP/runtimes.json"
          python3 - <<'PY'
          import json, os
          data = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "runtimes.json")))
          chosen = ""
          for runtime in data.get("runtimes", []):
              if runtime.get("platform") != "iOS" or not runtime.get("isAvailable"):
                  continue
              archs = runtime.get("supportedArchitectures")
              print(f'{runtime.get("name")}: supportedArchitectures={archs}')
              # Older simctl versions omit the key; treat that as unknown and try anyway.
              if archs is None or "x86_64" in archs:
                  chosen = runtime["identifier"]
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              if chosen:
                  env.write(f"SIM_RUNTIME={chosen}\n")
              else:
                  env.write("SIM_SKIP=no-x86_64-runtime\n")
          print("Chosen runtime:", chosen or "none with x86_64")
          PY

      - name: Build the iOS plugin
        if: env.SIM_SKIP == ''
        uses: ./.github/actions/build-ios-plugin

      - name: Set up Godot for iOS export
        if: env.SIM_SKIP == ''
        uses: ./.github/actions/setup-godot-ios

      - name: Export the Xcode project
        if: env.SIM_SKIP == ''
        uses: ./.github/actions/export-ios
        with:
          configuration: debug
          output-dir: ${{ runner.temp }}/ios-export

      - name: Build for the Simulator (x86_64)
        if: env.SIM_SKIP == ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          derived="$RUNNER_TEMP/ios-derived"
          if ! xcodebuild \
            -project "$IOS_EXPORT/$EXPORT_NAME.xcodeproj" \
            -scheme "$EXPORT_NAME" \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$derived" \
            ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO EXCLUDED_ARCHS="" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            build > "$IOS_LOGS/xcodebuild-simulator.log" 2>&1; then
            grep -E 'error:|Undefined symbols|\*\* BUILD' "$IOS_LOGS/xcodebuild-simulator.log" | tail -80 || true
            echo "::warning::xcodebuild failed for the x86_64 Simulator"
            exit 1
          fi
          app="$derived/Build/Products/Debug-iphonesimulator/$EXPORT_NAME.app"
          executable="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")"
          lipo -info "$app/$executable"
          {
            echo "APP_PATH=$app"
            echo "APP_EXECUTABLE=$executable"
          } >> "$GITHUB_ENV"

      - name: Launch in the Simulator and take screenshots
        if: env.SIM_SKIP == '' && env.APP_PATH != ''
        timeout-minutes: 10
        run: |
          set -euo pipefail
          udid="$(xcrun simctl create after-you-ci "$SIMULATOR_DEVICE" "$SIM_RUNTIME")"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          # The Simulator refuses unsigned code; an ad-hoc signature is enough.
          codesign --force --deep --sign - --timestamp=none "$APP_PATH"
          xcrun simctl install "$udid" "$APP_PATH"
          # Godot prints to stdout, not the unified log, so capture its output directly.
          xcrun simctl launch --stdout="$IOS_LOGS/godot-stdout.log" --stderr="$IOS_LOGS/godot-stderr.log" "$udid" "$BUNDLE_ID" | tee "$IOS_LOGS/launch.txt"
          # GL Compatibility under Rosetta is slow; look twice to see whether Home appears.
          elapsed=0
          for at in 30 90; do
            sleep $((at - elapsed))
            elapsed=$at
            shot="$IOS_LOGS/simulator-${at}s.png"
            xcrun simctl io "$udid" screenshot "$shot"
            # Screenshots come out in portrait; this copy turns the landscape game upright.
            sips -r 90 "$shot" --out "$IOS_LOGS/simulator-${at}s-landscape.png" > /dev/null
            services="$(xcrun simctl spawn "$udid" launchctl list || true)"
            if grep -q "UIKitApplication:$BUNDLE_ID" <<<"$services"; then
              echo "App still running after $at s" | tee -a "$IOS_LOGS/launch.txt"
            else
              echo "::warning::App is not running after $at s; see godot-stdout.log and godot-stderr.log"
              break
            fi
          done
          tail -40 "$IOS_LOGS/godot-stdout.log" "$IOS_LOGS/godot-stderr.log" 2>/dev/null || true

      - name: Remove the temporary simulator
        if: always() && env.SIM_UDID != ''
        run: |
          xcrun simctl shutdown "$SIM_UDID" || true
          xcrun simctl delete "$SIM_UDID" || true

      - name: Upload logs and screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-simulator-logs
          path: ${{ runner.temp }}/ios-logs
          retention-days: 14
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------------------
  # Phase 2: signed App Store build and TestFlight upload. Manual runs only, so a branch push
  # never uses the signing key. Repository secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID,
  # ASC_KEY_P8_BASE64 (team key with the Admin role, for cloud-managed signing). Optional:
  # IOS_APP_CONFIG_BASE64 (store mode and RevenueCat key) and
  # IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 (push). Start a new run for every upload; a re-run
  # keeps the run number, so App Store Connect would refuse the repeated build number.
  # ---------------------------------------------------------------------------------------
  testflight:
    name: Signed build and TestFlight upload
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # CFBundleVersion is the run number plus this offset, so it only ever goes up.
      IOS_BUILD_NUMBER_OFFSET: "100"
      ICLOUD_CONTAINER: iCloud.com.aamirazeez.afteryou
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Select the pinned Xcode
        run: sudo xcode-select --switch "$XCODE_APP" && xcodebuild -version

      - name: Build the iOS plugin (release)
        uses: ./.github/actions/build-ios-plugin
        with:
          target: template_release
          # Optional. Without it push stays off and Firebase is left out of the build.
          firebase-plist-base64: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 }}

      - name: Set up Godot for iOS export
        uses: ./.github/actions/setup-godot-ios
        with:
          team-id: ${{ secrets.APPLE_TEAM_ID }}
          live-services: "true"
          # Optional private app_config.json with purchase_mode "app_store" and the appl_ key.
          # Without it the build keeps purchase_mode "tester_only" with no key: on iOS the store
          # is off and Tester code is hidden in release builds, so nothing can be bought.
          app-config-base64: ${{ secrets.IOS_APP_CONFIG_BASE64 }}
          # OWNER STEP (phase 4): set to "true" once apple-app-site-association is live on
          # aamirazeez.com (see claude-20261011\ios\site-upload). The plugin already handles links.
          universal-links: "false"
          game-center: "true"
          icloud-container: ${{ env.ICLOUD_CONTAINER }}

      - name: Set the version, build number and signing identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          root = Path(os.environ["GAME_COPY"])
          project = (root / "project.godot").read_text(encoding="utf-8")
          version = re.search(r'^config/version="([0-9]+\.[0-9]+\.[0-9]+)"$', project, re.M)
          if not version:
              raise SystemExit("project.godot has no x.y.z config/version")
          build = int(os.environ["GITHUB_RUN_NUMBER"]) + int(os.environ["IOS_BUILD_NUMBER_OFFSET"])
          path = root / "export_presets.cfg"
          text = path.read_text(encoding="utf-8")
          # Automatic signing archives with a development identity; the App Store export
          # re-signs with the cloud-managed distribution certificate.
          for old, new in (
              ('application/version=""\n', f'application/version="{build}"\n'),
              ('application/short_version=""\n', f'application/short_version="{version.group(1)}"\n'),
              ('application/code_sign_identity_release=""\n', 'application/code_sign_identity_release="Apple Development"\n'),
          ):
              if text.count(old) != 1:
                  raise SystemExit(f"Expected one {old.strip()} in the iOS preset")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              env.write(f"IOS_BUILD_NUMBER={build}\nIOS_SHORT_VERSION={version.group(1)}\n")
          print(f"Version {version.group(1)}, build {build}")
          PY

      - name: Export a release Xcode project
        uses: ./.github/actions/export-ios
        with:
          configuration: release
          output-dir: ${{ runner.temp }}/ios-release

      - name: Show the release signing settings
        run: |
          set -euo pipefail
          pbx="$IOS_EXPORT/$EXPORT_NAME.xcodeproj/project.pbxproj"
          grep -q 'libafteryou_ios.ios.template_release.xcframework' "$pbx"
          grep -E 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|CODE_SIGN_ENTITLEMENTS|PROVISIONING_PROFILE' "$pbx" | sort -u
          find "$IOS_EXPORT" -maxdepth 2 -name '*.entitlements' -print -exec cat {} \; | tee "$IOS_LOGS/project-entitlements.txt"

      - name: Write the App Store Connect key for this job only
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$key"
          chmod 600 "$key"
          grep -q 'BEGIN PRIVATE KEY' "$key" || { echo "::error::ASC_KEY_P8_BASE64 does not decode to a .p8 key"; exit 1; }

      - name: Archive and export with cloud-managed signing
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          auth=(-allowProvisioningUpdates -authenticationKeyPath "$key" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          # The team has no registered devices, so Apple cannot make the development profile an
          # automatically signed archive needs. The archive is signed ad hoc instead, which keeps
          # the entitlements in the binary; the App Store export below re-signs everything with
          # the cloud-managed distribution certificate and an App Store profile (no devices).
          xcodebuild archive \
            -project "$IOS_EXPORT/$EXPORT_NAME.xcodeproj" -scheme "$EXPORT_NAME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/$EXPORT_NAME.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES PROVISIONING_PROFILE_SPECIFIER="" PROVISIONING_PROFILE="" \
            > "$IOS_LOGS/archive.log" 2>&1 || { grep -E 'error:|\*\* ARCHIVE' "$IOS_LOGS/archive.log" | tail -40 || true; tail -80 "$IOS_LOGS/archive.log"; exit 1; }
          tail -3 "$IOS_LOGS/archive.log"
          archived="$RUNNER_TEMP/$EXPORT_NAME.xcarchive/Products/Applications/$EXPORT_NAME.app"
          codesign -d --entitlements - --xml "$archived" 2>/dev/null | plutil -p - | tee "$IOS_LOGS/archive-entitlements.txt" || true
          grep -iE 'certificate|provisioning profile' "$IOS_LOGS/archive.log" | sort -u | head -20 || true
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$EXPORT_NAME.xcarchive" \
            -exportPath "$RUNNER_TEMP/ipa" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" "${auth[@]}" \
            > "$IOS_LOGS/export-archive.log" 2>&1 || { grep -E 'error' "$IOS_LOGS/export-archive.log" | tail -40 || true; tail -80 "$IOS_LOGS/export-archive.log"; exit 1; }
          tail -3 "$IOS_LOGS/export-archive.log"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Check the signed app
        env:
          PUSH_CONFIGURED: ${{ secrets.IOS_GOOGLE_SERVICE_INFO_PLIST_BASE64 != '' }}
        run: |
          set -euo pipefail
          ipa="$RUNNER_TEMP/ipa/$EXPORT_NAME.ipa"
          test -f "$ipa"
          shasum -a 256 "$ipa" | tee "$IOS_LOGS/ipa.sha256"
          rm -rf "$RUNNER_TEMP/ipa-check"
          ditto -x -k "$ipa" "$RUNNER_TEMP/ipa-check"
          app="$(find "$RUNNER_TEMP/ipa-check/Payload" -maxdepth 1 -name '*.app' | head -1)"
          test -d "$app"
          plist="$app/Info.plist"
          {
            for key in CFBundleIdentifier CFBundleDisplayName CFBundleShortVersionString CFBundleVersion ITSAppUsesNonExemptEncryption; do
              printf '%s: %s\n' "$key" "$(/usr/libexec/PlistBuddy -c "Print :$key" "$plist" 2>/dev/null || echo '(absent)')"
            done
            codesign -dv "$app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Identifier)=' || true
          } | tee "$IOS_LOGS/signed-app.txt"
          codesign -d --entitlements - --xml "$app" 2>/dev/null > "$RUNNER_TEMP/entitlements.plist"
          plutil -p "$RUNNER_TEMP/entitlements.plist" | tee "$IOS_LOGS/signed-entitlements.txt"
          ent() { /usr/libexec/PlistBuddy -c "Print :$1" "$RUNNER_TEMP/entitlements.plist" 2>/dev/null || true; }
          fail=0
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" = "$BUNDLE_ID" ] || { echo "::error::Wrong bundle ID"; fail=1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$IOS_BUILD_NUMBER" ] || { echo "::error::CFBundleVersion is not $IOS_BUILD_NUMBER"; fail=1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$IOS_SHORT_VERSION" ] || { echo "::error::Short version is not $IOS_SHORT_VERSION"; fail=1; }
          [ "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist" 2>/dev/null)" = "false" ] || { echo "::error::ITSAppUsesNonExemptEncryption must be false"; fail=1; }
          [ "$(ent com.apple.developer.game-center)" = "true" ] || { echo "::error::Game Center entitlement missing"; fail=1; }
          ent com.apple.developer.icloud-container-identifiers | grep -q "$ICLOUD_CONTAINER" || { echo "::error::iCloud container entitlement missing"; fail=1; }
          ent com.apple.developer.icloud-services | grep -q 'CloudDocuments' || { echo "::error::iCloud Documents entitlement missing"; fail=1; }
          if [ "$PUSH_CONFIGURED" = "true" ]; then
            [ "$(ent aps-environment)" = "production" ] || { echo "::error::aps-environment is not production"; fail=1; }
          fi
          [ "$(ent get-task-allow)" != "true" ] || { echo "::error::A distribution build must not allow debugging"; fail=1; }
          exit $fail

      - name: Upload to App Store Connect
        timeout-minutes: 30
        run: |
          set -euo pipefail
          # altool ships with the pinned Xcode and reads AuthKey_<id>.p8 from this folder.
          export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/asc"
          xcrun altool --help 2>&1 | grep -iE 'apiKey|apiIssuer|p8|private' | head -10 || true
          set +e
          xcrun altool --upload-app -f "$RUNNER_TEMP/ipa/$EXPORT_NAME.ipa" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal \
            2>&1 | tee "$IOS_LOGS/upload.log"
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] || grep -qiE 'ERROR ITMS|Failed to upload|UPLOAD FAILED' "$IOS_LOGS/upload.log"; then
            echo "::error::The upload to App Store Connect failed (exit $status)"
            exit 1
          fi
          echo "Uploaded $IOS_SHORT_VERSION ($IOS_BUILD_NUMBER); App Store Connect processes it before TestFlight shows it."

      - name: Remove the App Store Connect key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/ipa-check" "$RUNNER_TEMP/entitlements.plist"

      - name: Upload signing logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ios-testflight-logs
          path: ${{ runner.temp }}/ios-logs
          retention-days: 14
          if-no-files-found: warn
